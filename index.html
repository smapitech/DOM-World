<!DOCTYPE html>
<html>
<head>
  <title>Image Changer</title>
</head>
<body>

  <h1>Image Changer</h1>

  <img id="picture" src="https://via.placeholder.com/200?text=Image+1" width="200">

  <br><br>

  <button onclick="changeImage()">Change Image</button>

  <script>
    function changeImage() {
      document.getElementById("picture").src =
        "https://via.placeholder.com/200?text=Image+2";
    }
  </script>

</body>
</html>
